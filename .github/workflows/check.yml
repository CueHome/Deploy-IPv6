name: Shell checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh test/preflight.sh
      - run: python3 test/runtime.py
      - run: python3 test/transaction.py
      - run: sudo sh test/linux-netns.sh
